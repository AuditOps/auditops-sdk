[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditops"
version = "0.1.0"
description = "Open-source evidence collection framework."
requires-python = ">=3.11"

dependencies = [
    "boto3",
    "requests"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]